<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Basket</title>
<link rel="stylesheet" href="shoppingPasket.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<header>
    <h1>Shopping Basket</h1>
</header>

<div class="cart-container" id="cartContainer">
    <!-- المنتجات هتظهر هنا بالـ JS -->
</div>

<button class="back-btn" onclick="window.location.href='index.html'">
    <i class="fa-solid fa-arrow-left"></i> العودة للتسوق
</button>

<script>
// ======== Cart JS ========

let cart = JSON.parse(localStorage.getItem("cart")) || [];
const cartContainer = document.getElementById("cartContainer");

function renderCart() {
    cartContainer.innerHTML = "";

    if (cart.length === 0) {
        cartContainer.innerHTML = '<div class="empty-cart">سلة المشتريات فارغة <i class="fa-solid fa-cart-arrow-down" style="color: rgb(59, 130, 246);"></i></div>';
        return;
    }

    let total = 0;

    cart.forEach((item, index) => {
        let quantity = item.quantity || 1;
        let priceNum = parseFloat(item.price.replace(/[^0-9.]/g, ""));
        total += priceNum * quantity;

        const div = document.createElement("div");
        div.classList.add("cart-item");
        div.innerHTML = `
            <img src="${item.image || 'placeholder.png'}" alt="${item.title}" class="cart-image">
            <div class="cart-details">
                <span class="cart-title">${item.title}</span>
                <span class="cart-price">${item.price}</span>
            </div>
            <div class="quantity-controls">
                <button class="decrease" data-index="${index}">-</button>
                <span class="quantity">${quantity}</span>
                <button class="increase" data-index="${index}">+</button>
                <button class="delete" data-index="${index}"><i class="fa-solid fa-trash"></i></button>
            </div>
            <button class="confirm-btn" onclick="window.location.href='checkout.html'">Confirm Purchase</button>
        `;
        cartContainer.appendChild(div);

        div.querySelector(".increase").addEventListener("click", () => {
            if (!item.quantity) item.quantity = 1;
            item.quantity++;
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        });

        div.querySelector(".decrease").addEventListener("click", () => {
            if (!item.quantity) item.quantity = 1;
            if (item.quantity > 1) {
                item.quantity--;
            } else {
                cart.splice(index, 1);
            }
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        });

        div.querySelector(".delete").addEventListener("click", () => {
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            renderCart();
        });
    });

    const totalDiv = document.createElement("div");
    totalDiv.classList.add("total");
    totalDiv.innerText = `المجموع: $${total.toFixed(2)}`;
    cartContainer.appendChild(totalDiv);
}

renderCart();
</script>

</body>
</html>
